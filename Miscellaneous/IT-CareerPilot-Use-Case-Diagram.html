<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT CareerPilot Use Case Diagram</title>
  <style>
    :root {
      --paper: #f3f2f2;
      --paper-2: #eae9e9;
      --white: #ffffff;
      --ink: #201f1d;
      --muted: #605d5d;
      --soft: #8a8583;
      --rule: rgba(32,31,29,.16);
      --rule-solid: #c9c5c3;
      --accent: #c0492f;
      --accent-tint: #fff3e4;
      --link: #b68235;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
    body { display: grid; place-items: start center; }
    svg { display: block; width: min(100vw, 1280px); height: auto; background: var(--paper); }
    .boundary { fill: rgba(32,31,29,.012); stroke: var(--rule-solid); stroke-width: 1; }
    .section-line { stroke: var(--rule); stroke-width: 1; }
    .section-label { font-family: "Geist Mono", monospace; font-size: 8px; font-weight: 600; letter-spacing: .13em; fill: var(--soft); }
    .system-label { font-family: "Instrument Serif", Georgia, serif; font-size: 22px; font-weight: 600; fill: var(--ink); }
    .usecase { fill: var(--white); stroke: var(--muted); stroke-width: 1; }
    .usecase-support { fill: var(--paper-2); stroke: var(--soft); stroke-width: 1; }
    .usecase-focus { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .uc-name { font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .uc-sub { font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 10px; fill: var(--muted); text-anchor: middle; }
    .actor-name { font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .actor-sub { font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 10px; fill: var(--muted); text-anchor: middle; }
    .relation { font-family: "Geist Mono", monospace; font-size: 8px; font-weight: 600; fill: var(--accent); text-anchor: middle; }
    .note-title { font-family: "Geist Mono", monospace; font-size: 8px; font-weight: 600; letter-spacing: .1em; fill: var(--link); }
    .note { font-family: "Instrument Serif", Georgia, serif; font-size: 14px; font-style: italic; fill: var(--accent); }
    .legend { font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 11px; fill: var(--muted); }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="uc-title uc-desc">
    <title id="uc-title">IT CareerPilot Use Case Diagram</title>
    <desc id="uc-desc">A proposal-stage use case diagram showing a student interacting with CareerPilot to manage a profile, explore roles, select a target role, tailor a resume, prepare for interviews, and view preparation progress. Public job sources and skill taxonomies support the job and skill knowledge used by recommendations and resume tailoring.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#605d5d"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c0492f"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b68235"/></marker>
    </defs>

    <rect width="1280" height="720" fill="#f3f2f2"/>

    <!-- System boundary -->
    <rect class="boundary" x="210" y="34" width="820" height="592" rx="8"/>
    <rect x="234" y="24" width="172" height="28" fill="#f3f2f2"/>
    <text class="system-label" x="246" y="45">IT CareerPilot</text>

    <line class="section-line" x1="232" y1="246" x2="1008" y2="246"/>
    <line class="section-line" x1="232" y1="474" x2="1008" y2="474"/>
    <rect x="234" y="62" width="132" height="16" fill="#f3f2f2"/>
    <text class="section-label" x="242" y="74">PROFILE &amp; DISCOVERY</text>
    <rect x="234" y="254" width="154" height="16" fill="#f3f2f2"/>
    <text class="section-label" x="242" y="266">APPLICATION PREPARATION</text>
    <rect x="234" y="482" width="86" height="16" fill="#f3f2f2"/>
    <text class="section-label" x="242" y="494">READINESS</text>

    <!-- Actor associations behind use cases -->
    <line x1="138" y1="322" x2="278" y2="122" stroke="#605d5d" stroke-width="1.1"/>
    <line x1="138" y1="322" x2="278" y2="206" stroke="#605d5d" stroke-width="1.1"/>
    <line x1="138" y1="322" x2="278" y2="314" stroke="#605d5d" stroke-width="1.1"/>
    <line x1="138" y1="322" x2="278" y2="400" stroke="#605d5d" stroke-width="1.1"/>
    <line x1="138" y1="322" x2="278" y2="536" stroke="#605d5d" stroke-width="1.1"/>
    <line x1="138" y1="322" x2="278" y2="596" stroke="#605d5d" stroke-width="1.1"/>

    <!-- Include / extend relations -->
    <line x1="500" y1="206" x2="666" y2="206" stroke="#c0492f" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
    <rect x="553" y="193" width="62" height="14" fill="#f3f2f2"/>
    <text class="relation" x="584" y="202">&lt;&lt;include&gt;&gt;</text>

    <line x1="500" y1="400" x2="666" y2="400" stroke="#c0492f" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
    <rect x="553" y="387" width="62" height="14" fill="#f3f2f2"/>
    <text class="relation" x="584" y="396">&lt;&lt;include&gt;&gt;</text>

    <path d="M 492 224 H 560 V 286 H 650" fill="none" stroke="#b68235" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-link)"/>
    <rect x="529" y="273" width="62" height="14" fill="#f3f2f2"/>
    <text class="relation" x="560" y="282">&lt;&lt;include&gt;&gt;</text>

    <path d="M 492 380 H 560 V 342 H 662" fill="none" stroke="#b68235" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-link)"/>
    <rect x="529" y="351" width="62" height="14" fill="#f3f2f2"/>
    <text class="relation" x="560" y="360">&lt;&lt;include&gt;&gt;</text>

    <!-- External actor associations -->
    <line x1="1112" y1="153" x2="914" y2="314" stroke="#8a8583" stroke-width="1.1"/>
    <line x1="1112" y1="486" x2="914" y2="314" stroke="#8a8583" stroke-width="1.1"/>

    <!-- Student actor -->
    <circle cx="106" cy="270" r="21" fill="none" stroke="#201f1d" stroke-width="1.5"/>
    <line x1="106" y1="291" x2="106" y2="352" stroke="#201f1d" stroke-width="1.5"/>
    <line x1="70" y1="315" x2="142" y2="315" stroke="#201f1d" stroke-width="1.5"/>
    <line x1="106" y1="352" x2="76" y2="395" stroke="#201f1d" stroke-width="1.5"/>
    <line x1="106" y1="352" x2="136" y2="395" stroke="#201f1d" stroke-width="1.5"/>
    <text class="actor-name" x="106" y="424">Student</text>
    <text class="actor-sub" x="106" y="441">Primary actor</text>

    <!-- External actors -->
    <circle cx="1145" cy="104" r="17" fill="none" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="121" x2="1145" y2="166" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1118" y1="139" x2="1172" y2="139" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="166" x2="1122" y2="198" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="166" x2="1168" y2="198" stroke="#605d5d" stroke-width="1.3"/>
    <text class="actor-name" x="1145" y="222">Public Job Sources</text>
    <text class="actor-sub" x="1145" y="238">External data actor</text>

    <circle cx="1145" cy="438" r="17" fill="none" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="455" x2="1145" y2="500" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1118" y1="473" x2="1172" y2="473" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="500" x2="1122" y2="532" stroke="#605d5d" stroke-width="1.3"/>
    <line x1="1145" y1="500" x2="1168" y2="532" stroke="#605d5d" stroke-width="1.3"/>
    <text class="actor-name" x="1145" y="556">Skill Taxonomies</text>
    <text class="actor-sub" x="1145" y="572">ESCO / O*NET</text>

    <!-- Primary use cases -->
    <ellipse class="usecase" cx="390" cy="122" rx="112" ry="38"/>
    <text class="uc-name" x="390" y="119">Manage Student Profile</text>
    <text class="uc-sub" x="390" y="137">Resume · intent · constraints</text>

    <ellipse class="usecase" cx="390" cy="206" rx="112" ry="38"/>
    <text class="uc-name" x="390" y="203">Explore Recommended Roles</text>
    <text class="uc-sub" x="390" y="221">Ranked internships and jobs</text>

    <ellipse class="usecase" cx="390" cy="314" rx="112" ry="38"/>
    <text class="uc-name" x="390" y="311">Select Target Role</text>
    <text class="uc-sub" x="390" y="329">Choose one role to prepare for</text>

    <ellipse class="usecase-focus" cx="390" cy="400" rx="112" ry="40"/>
    <text class="uc-name" x="390" y="397">Tailor Resume to JD</text>
    <text class="uc-sub" x="390" y="415">Grounded, role-specific advice</text>

    <ellipse class="usecase" cx="390" cy="536" rx="112" ry="38"/>
    <text class="uc-name" x="390" y="533">Practice Mock Interview</text>
    <text class="uc-sub" x="390" y="551">Questions · recording · feedback</text>

    <ellipse class="usecase" cx="390" cy="596" rx="112" ry="28"/>
    <text class="uc-name" x="390" y="600">View Preparation Progress</text>

    <!-- Supporting use cases -->
    <ellipse class="usecase-support" cx="778" cy="206" rx="112" ry="38"/>
    <text class="uc-name" x="778" y="203">Review Match Evidence</text>
    <text class="uc-sub" x="778" y="221">Rationale · transferable and hard gaps</text>

    <ellipse class="usecase-support" cx="778" cy="314" rx="136" ry="38"/>
    <text class="uc-name" x="778" y="311">Use Job &amp; Skill Knowledge</text>
    <text class="uc-sub" x="778" y="329">Structured JDs · normalised skills</text>

    <ellipse class="usecase-focus" cx="778" cy="400" rx="112" ry="40"/>
    <text class="uc-name" x="778" y="397">Approve or Edit Changes</text>
    <text class="uc-sub" x="778" y="415">Clarify missing facts when needed</text>

    <!-- Scope note and legend -->
    <line x1="40" y1="650" x2="1240" y2="650" stroke="#c9c5c3" stroke-width="1"/>
    <text class="note-title" x="40" y="681">SCOPE</text>
    <text class="note" x="100" y="681">Application submission happens outside CareerPilot; the student retains final control.</text>
    <ellipse cx="866" cy="677" rx="20" ry="10" fill="#ffffff" stroke="#605d5d" stroke-width=".8"/>
    <text class="legend" x="896" y="681">Primary use case</text>
    <ellipse cx="1024" cy="677" rx="20" ry="10" fill="#eae9e9" stroke="#8a8583" stroke-width=".8"/>
    <text class="legend" x="1054" y="681">Supporting use case</text>
  </svg>
</body>
</html>
