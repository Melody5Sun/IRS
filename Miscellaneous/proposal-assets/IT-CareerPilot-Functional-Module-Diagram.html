<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT CareerPilot Functional Module Diagram</title>
  <style>
    :root {
      --paper: #f3f2f2;
      --paper-2: #eae9e9;
      --ink: #201f1d;
      --muted: #605d5d;
      --soft: #8a8583;
      --rule: rgba(32, 31, 29, 0.16);
      --rule-solid: #c9c5c3;
      --accent: #c0492f;
      --accent-tint: #fff3e4;
      --link: #b68235;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
    body { display: grid; place-items: start center; }
    svg { display: block; width: min(100vw, 1280px); height: auto; background: var(--paper); }
    .title { font-family: "Instrument Serif", "Noto Serif SC", "STSong", serif; font-size: 40px; font-weight: 400; fill: var(--ink); }
    .subtitle { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: var(--muted); }
    .eyebrow { font-family: "Geist Mono", monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.16em; fill: #7d5411; }
    .brand { font-family: "Instrument Serif", Georgia, serif; font-size: 20px; font-weight: 600; fill: var(--ink); }
    .zone-label { font-family: "Geist Mono", monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.14em; fill: var(--soft); }
    .node-name { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 600; fill: var(--ink); }
    .node-name-light { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 600; fill: #fffaf4; }
    .node-sub { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: var(--muted); }
    .node-sub-light { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #ffe3d7; }
    .tech { font-family: "Geist Mono", "Noto Sans SC", monospace; font-size: 12px; fill: #7d5411; }
    .legend { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: var(--muted); }
    .human { font-family: "Noto Serif SC", "STSong", serif; font-size: 16px; font-style: italic; fill: var(--accent); }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="careerpilot-functional-title careerpilot-functional-desc">
    <title id="careerpilot-functional-title">IT CareerPilot Functional Module Diagram</title>
    <desc id="careerpilot-functional-desc">The diagram shows how student profiles and public job data pass through parsing and hybrid reasoning to support job recommendations, resume optimization, mock interviews, and preparation progress tracking, with the student retaining final review and submission authority.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#605d5d"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#c0492f"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b68235"/>
      </marker>
    </defs>

    <rect width="1280" height="720" fill="#f3f2f2"/>

    <!-- Zones -->
    <rect x="40" y="32" width="1200" height="136" rx="8" fill="rgba(32,31,29,0.018)" stroke="rgba(32,31,29,0.12)" stroke-width="0.8"/>
    <rect x="52" y="36" width="92" height="16" rx="2" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="48">INPUT &amp; DATA</text>

    <rect x="40" y="180" width="1200" height="228" rx="8" fill="rgba(32,31,29,0.018)" stroke="rgba(32,31,29,0.12)" stroke-width="0.8"/>
    <rect x="52" y="184" width="112" height="16" rx="2" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="196">CORE REASONING</text>

    <rect x="40" y="420" width="1200" height="204" rx="8" fill="rgba(32,31,29,0.018)" stroke="rgba(32,31,29,0.12)" stroke-width="0.8"/>
    <rect x="52" y="424" width="132" height="16" rx="2" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="436">STUDENT SERVICES</text>

    <!-- Connectors: input to parser -->
    <path d="M 340 140 V 168 Q 340 176 348 176 H 512 Q 520 176 520 184 V 232" fill="none" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 940 140 V 168 Q 940 176 932 176 H 768 Q 760 176 760 184 V 232" fill="none" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Core connector -->
    <line x1="640" y1="296" x2="640" y2="320" stroke="#c0492f" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

    <!-- Fanned connectors to four services -->
    <path d="M 472 392 V 400 Q 472 408 464 408 H 204 Q 196 408 196 416 V 468" fill="none" stroke="#b68235" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M 584 392 V 424 Q 584 432 576 432 H 500 Q 492 432 492 440 V 468" fill="none" stroke="#b68235" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M 696 392 V 424 Q 696 432 704 432 H 780 Q 788 432 788 440 V 468" fill="none" stroke="#b68235" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <path d="M 808 392 V 400 Q 808 408 816 408 H 1076 Q 1084 408 1084 416 V 468" fill="none" stroke="#b68235" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Input nodes -->
    <rect x="180" y="72" width="320" height="68" rx="6" fill="#eae9e9"/>
    <rect x="180" y="72" width="320" height="68" rx="6" fill="none" stroke="#8a8583" stroke-width="1"/>
    <text class="node-name" x="200" y="100">Student Profile</text>
    <text class="node-sub" x="200" y="124">Resume · Role Goal · Location · Graduation · Work Pass</text>

    <rect x="780" y="72" width="320" height="68" rx="6" fill="#eae9e9"/>
    <rect x="780" y="72" width="320" height="68" rx="6" fill="none" stroke="#8a8583" stroke-width="1"/>
    <text class="node-name" x="800" y="100">Job &amp; Skill Data</text>
    <text class="node-sub" x="800" y="124">Public IT JDs · ESCO / O*NET · Skill Aliases</text>

    <!-- Core nodes -->
    <rect x="420" y="232" width="440" height="64" rx="6" fill="#ffffff"/>
    <rect x="420" y="232" width="440" height="64" rx="6" fill="none" stroke="#605d5d" stroke-width="1"/>
    <text class="node-name" x="444" y="260">Parsing &amp; Structuring</text>
    <text class="node-sub" x="444" y="284">Resume Parsing · JD Analysis · Skill Normalization · PII Removal</text>
    <text class="tech" x="836" y="268" text-anchor="end">spaCy · NLP</text>

    <rect x="380" y="320" width="520" height="72" rx="6" fill="#c0492f"/>
    <rect x="380" y="320" width="520" height="72" rx="6" fill="none" stroke="#c0492f" stroke-width="1.2"/>
    <text class="node-name-light" x="404" y="348">Hybrid Reasoning Engine</text>
    <text class="node-sub-light" x="404" y="376">Constraints · Semantic Match · Skill Gaps · Grounded Generation</text>
    <text class="node-sub-light" x="876" y="348" text-anchor="end">Rules · SBERT · KG · LLM</text>

    <!-- Student service nodes -->
    <rect x="64" y="468" width="264" height="104" rx="6" fill="#ffffff"/>
    <rect x="64" y="468" width="264" height="104" rx="6" fill="none" stroke="#605d5d" stroke-width="1"/>
    <text class="node-name" x="84" y="500">Job Recommendation</text>
    <text class="node-sub" x="84" y="528">Match Ranking · Evidence</text>
    <text class="node-sub" x="84" y="552">Skill Gaps · Rationale</text>

    <rect x="360" y="468" width="264" height="104" rx="6" fill="#fff3e4"/>
    <rect x="360" y="468" width="264" height="104" rx="6" fill="none" stroke="#b68235" stroke-width="1"/>
    <text class="node-name" x="380" y="500">Resume Optimization</text>
    <text class="node-sub" x="380" y="528">JD-Specific Rewriting · Gap Prompts</text>
    <text class="node-sub" x="380" y="552">Fact Check · User Approval</text>

    <rect x="656" y="468" width="264" height="104" rx="6" fill="#ffffff"/>
    <rect x="656" y="468" width="264" height="104" rx="6" fill="none" stroke="#605d5d" stroke-width="1"/>
    <text class="node-name" x="676" y="500">Mock Interview Prototype</text>
    <text class="node-sub" x="676" y="528">Role-Based Questions · Recording</text>
    <text class="node-sub" x="676" y="552">Transcript Placeholder · Feedback</text>

    <rect x="952" y="468" width="264" height="104" rx="6" fill="#ffffff"/>
    <rect x="952" y="468" width="264" height="104" rx="6" fill="none" stroke="#605d5d" stroke-width="1"/>
    <text class="node-name" x="972" y="500">Preparation Progress</text>
    <text class="node-sub" x="972" y="528">Resume Readiness · Interview Readiness</text>
    <text class="node-sub" x="972" y="552">Completion Status · Target Role</text>

    <!-- Human-in-the-loop boundary and legend -->
    <line x1="40" y1="648" x2="1240" y2="648" stroke="#c9c5c3" stroke-width="1"/>
    <text class="eyebrow" x="40" y="676">LEGEND</text>
    <rect x="120" y="664" width="16" height="16" rx="4" fill="#eae9e9" stroke="#8a8583" stroke-width="0.8"/>
    <text class="legend" x="148" y="676">Input &amp; Data</text>
    <rect x="316" y="664" width="16" height="16" rx="4" fill="#c0492f"/>
    <text class="legend" x="344" y="676">Core Reasoning</text>
    <rect x="520" y="664" width="16" height="16" rx="4" fill="#ffffff" stroke="#605d5d" stroke-width="0.8"/>
    <text class="legend" x="548" y="676">Student Services</text>
    <text class="human" x="1240" y="676" text-anchor="end">The system recommends and drafts. The student reviews and submits.</text>
  </svg>
</body>
</html>
