<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT CareerPilot Typical User Flow</title>
  <style>
    :root {
      --paper: #f3f2f2;
      --paper-2: #eae9e9;
      --white: #ffffff;
      --ink: #201f1d;
      --muted: #605d5d;
      --soft: #8a8583;
      --rule: rgba(32, 31, 29, 0.14);
      --rule-solid: #c9c5c3;
      --accent: #c0492f;
      --accent-tint: #fff3e4;
      --link: #b68235;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
    body { display: grid; place-items: start center; }
    svg { display: block; width: min(100vw, 1280px); height: auto; background: var(--paper); }
    .zone { fill: rgba(32,31,29,0.018); stroke: var(--rule); stroke-width: .8; }
    .zone-label { font-family: "Geist Mono", "Microsoft YaHei", sans-serif; font-size: 8px; font-weight: 600; letter-spacing: .12em; fill: var(--soft); }
    .node { fill: var(--white); stroke: var(--muted); stroke-width: 1; }
    .student-node { fill: var(--paper-2); stroke: var(--soft); stroke-width: 1; }
    .background-node { fill: rgba(32,31,29,.02); stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .focus-node { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .submit-node { fill: var(--accent); stroke: var(--accent); stroke-width: 1.2; }
    .step { font-family: "Geist Mono", "Microsoft YaHei", sans-serif; font-size: 9px; font-weight: 600; letter-spacing: .08em; fill: var(--link); }
    .step-light { font-family: "Geist Mono", "Microsoft YaHei", sans-serif; font-size: 9px; font-weight: 600; letter-spacing: .08em; fill: #ffe3d7; }
    .name { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 600; fill: var(--ink); }
    .name-light { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 600; fill: #fffaf4; }
    .sub { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: var(--muted); }
    .sub-light { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #ffe3d7; }
    .chip { font-family: "Geist Mono", "Microsoft YaHei", sans-serif; font-size: 7px; font-weight: 600; letter-spacing: .08em; }
    .mini { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 10px; font-weight: 600; fill: var(--ink); }
    .branch { font-family: "Geist Mono", "Microsoft YaHei", sans-serif; font-size: 8px; font-weight: 600; fill: var(--accent); }
    .legend { font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 11px; fill: var(--muted); }
    .human { font-family: "Noto Serif SC", "STSong", serif; font-size: 14px; font-style: italic; fill: var(--accent); }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="flow-title flow-desc">
    <title id="flow-title">IT CareerPilot Typical User Flow</title>
    <desc id="flow-desc">The student uploads a resume and defines job preferences. The system builds a profile, recommends roles, supports resume revision and interview preparation, and shows preparation progress. The student retains final review and submission authority.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#605d5d"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#c0492f"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b68235"/></marker>
    </defs>

    <rect width="1280" height="720" fill="#f3f2f2"/>

    <!-- Phase bands -->
    <rect class="zone" x="40" y="30" width="1200" height="158" rx="8"/>
    <rect x="52" y="34" width="164" height="16" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="46">USER INPUT, PROFILE &amp; RECOMMENDATION</text>

    <rect class="zone" x="40" y="200" width="1200" height="226" rx="8"/>
    <rect x="52" y="204" width="156" height="16" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="216">TARGET ROLE &amp; RESUME ADAPTATION</text>

    <rect class="zone" x="40" y="438" width="1200" height="170" rx="8"/>
    <rect x="52" y="442" width="128" height="16" fill="#f3f2f2"/>
    <text class="zone-label" x="60" y="454">INTERVIEW PREPARATION &amp; SUBMISSION</text>

    <!-- Main connectors: snake reading order -->
    <line x1="316" y1="112" x2="344" y2="112" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="608" y1="112" x2="636" y2="112" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 1066 154 V 170 H 850 V 156" fill="none" stroke="#8a8583" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <path d="M 774 154 V 184 H 1066 V 230" fill="none" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="928" y1="274" x2="900" y2="274" stroke="#605d5d" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="636" y1="274" x2="596" y2="274" stroke="#c0492f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <path d="M 320 394 V 454 Q 320 462 312 462 H 210 Q 202 462 202 470" fill="none" stroke="#b68235" stroke-width="1.3" marker-end="url(#arrow-link)"/>
    <line x1="370" y1="520" x2="424" y2="520" stroke="#b68235" stroke-width="1.3" marker-end="url(#arrow-link)"/>
    <line x1="370" y1="520" x2="424" y2="520" stroke="#b68235" stroke-width="1.3" marker-end="url(#arrow-link)"/>
    <line x1="756" y1="520" x2="808" y2="520" stroke="#b68235" stroke-width="1.3" marker-end="url(#arrow-link)"/>

    <!-- Row 1 -->
    <rect class="student-node" x="64" y="70" width="252" height="84" rx="6"/>
    <text class="step" x="82" y="91">01 · STUDENT</text>
    <text class="name" x="82" y="115">Upload Resume &amp; Set Intent</text>
    <text class="sub" x="82" y="136">Role direction · Location · Graduation date</text>
    <text class="sub" x="82" y="150">Work pass · Weekly time budget</text>

    <rect class="node" x="356" y="70" width="252" height="84" rx="6"/>
    <text class="step" x="374" y="91">02 · SYSTEM</text>
    <text class="name" x="374" y="115">Parse Resume &amp; Build Profile</text>
    <text class="sub" x="374" y="136">Education · Skills · Projects · Internships</text>
    <text class="sub" x="374" y="150">Job preferences and constraints</text>

    <rect class="node" x="648" y="70" width="252" height="84" rx="6"/>
    <text class="step" x="666" y="91">03 · SYSTEM</text>
    <text class="name" x="666" y="115">Match &amp; Rank Jobs</text>
    <text class="sub" x="666" y="136">Rule filters · Semantic match · Skill graph</text>
    <text class="sub" x="666" y="150">Output: ranked roles + rationale</text>

    <rect class="background-node" x="940" y="70" width="252" height="84" rx="6"/>
    <text class="step" x="958" y="91">BACKGROUND JOB DATA PIPELINE</text>
    <text class="name" x="958" y="115">Acquire, Clean &amp; Structure JDs</text>
    <text class="sub" x="958" y="136">Responsibilities · Skills · Constraints</text>
    <text class="sub" x="958" y="150">Scheduled or on-demand refresh</text>

    <!-- Row 2 -->
    <rect class="student-node" x="940" y="232" width="252" height="84" rx="6"/>
    <text class="step" x="958" y="253">04 · STUDENT</text>
    <text class="name" x="958" y="277">Select Target Role</text>
    <text class="sub" x="958" y="298">Review fit evidence and gaps, then choose</text>

    <rect class="node" x="648" y="232" width="252" height="84" rx="6"/>
    <text class="step" x="666" y="253">05 · SYSTEM</text>
    <text class="name" x="666" y="277">Generate JD-Specific Advice</text>
    <text class="sub" x="666" y="298">Gap detection · Content order · Rewriting</text>

    <!-- Step 7: human-in-the-loop subflow -->
    <rect class="focus-node" x="64" y="232" width="532" height="162" rx="6"/>
    <text class="step" x="84" y="253">06 · STUDENT + SYSTEM</text>
    <text class="name" x="84" y="277">Approve, Clarify &amp; Revise Resume</text>

    <polygon points="155,304 206,326 155,348 104,326" fill="#ffffff" stroke="#c0492f" stroke-width="1"/>
    <text class="mini" x="155" y="323" text-anchor="middle">Allow system</text>
    <text class="mini" x="155" y="335" text-anchor="middle">edits?</text>

    <line x1="206" y1="326" x2="254" y2="326" stroke="#c0492f" stroke-width="1.1" marker-end="url(#arrow-accent)"/>
    <text class="branch" x="224" y="318">YES</text>
    <rect x="264" y="302" width="108" height="45" rx="5" fill="#ffffff" stroke="#c0492f" stroke-width="1"/>
    <text class="mini" x="318" y="321" text-anchor="middle">System drafts</text>
    <text class="sub" x="318" y="338" text-anchor="middle">User reviews changes</text>

    <path d="M 155 348 V 366 H 264" fill="none" stroke="#605d5d" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="branch" x="165" y="363">NO</text>
    <rect x="264" y="354" width="108" height="30" rx="5" fill="#eae9e9" stroke="#8a8583" stroke-width="1"/>
    <text class="mini" x="318" y="373" text-anchor="middle">Student edits</text>

    <path d="M 372 324 H 404" fill="none" stroke="#c0492f" stroke-width="1.1" marker-end="url(#arrow-accent)"/>
    <rect x="414" y="294" width="158" height="62" rx="5" fill="#ffffff" stroke="#b68235" stroke-width="1"/>
    <text class="mini" x="493" y="314" text-anchor="middle">Missing details? Ask student</text>
    <text class="sub" x="493" y="333" text-anchor="middle">Regenerate from verified facts</text>
    <text class="sub" x="493" y="349" text-anchor="middle">Never invent experience</text>
    <path d="M 493 294 V 286 H 318 V 300" fill="none" stroke="#b68235" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-link)"/>

    <line x1="388" y1="366" x2="572" y2="366" stroke="#c9c5c3" stroke-width=".8"/>
    <text class="sub" x="388" y="383">Label: transferable gaps · hard gaps to close</text>

    <!-- Row 3 -->
    <rect class="node" x="64" y="472" width="306" height="96" rx="6"/>
    <text class="step" x="84" y="495">07 · SYSTEM</text>
    <text class="name" x="84" y="521">Prepare Mock Interview</text>
    <text class="sub" x="84" y="543">Question bank · Recorded answers</text>
    <text class="sub" x="84" y="559">Transcript placeholder · Per-question feedback</text>

    <rect class="submit-node" x="436" y="472" width="320" height="96" rx="6"/>
    <text class="step-light" x="456" y="495">08 · STUDENT</text>
    <text class="name-light" x="456" y="521">Review &amp; Submit Application</text>
    <text class="sub-light" x="456" y="544">Final review and submission remain with the student</text>

    <rect class="node" x="820" y="472" width="372" height="96" rx="6"/>
    <text class="step" x="840" y="495">09 · SYSTEM</text>
    <text class="name" x="840" y="521">Show Preparation Progress</text>
    <text class="sub" x="840" y="543">Summarise resume and interview readiness</text>
    <text class="sub" x="840" y="559">Show current completion status for the target role</text>

    <!-- Legend -->
    <line x1="40" y1="636" x2="1240" y2="636" stroke="#c9c5c3" stroke-width="1"/>
    <text class="zone-label" x="40" y="670">LEGEND</text>
    <rect x="98" y="658" width="16" height="16" rx="4" fill="#eae9e9" stroke="#8a8583" stroke-width=".8"/>
    <text class="legend" x="126" y="670">Student action</text>
    <rect x="224" y="658" width="16" height="16" rx="4" fill="#ffffff" stroke="#605d5d" stroke-width=".8"/>
    <text class="legend" x="252" y="670">System process</text>
    <rect x="350" y="658" width="16" height="16" rx="4" fill="#fff3e4" stroke="#c0492f" stroke-width=".8"/>
    <text class="legend" x="378" y="670">Human approval</text>
    <rect x="504" y="658" width="16" height="16" rx="4" fill="rgba(32,31,29,.02)" stroke="#8a8583" stroke-width=".8" stroke-dasharray="4 3"/>
    <text class="legend" x="532" y="670">Background data</text>
    <text class="human" x="1240" y="670" text-anchor="end">Recommendations assist; final review and submission remain with the student.</text>
  </svg>
</body>
</html>
